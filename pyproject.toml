[project]
name = "property-rental-management-system"
version = "0.1.0"
description = "AI-powered property rental management system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-postgres>=0.0.12",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.1",
    "alembic>=1.13.2",
    "pgvector>=0.3.5",
    "python-dotenv>=1.2.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "pandas>=2.2.3",
    "pypdf>=5.8.0",
    "python-docx>=1.1.2",
    "notebook>=7.2.2",
    "jupyterlab>=4.2.5",
    "ipykernel>=6.29.5",
    "pytest>=8.3.3",
    "fastapi>=0.139.0",
    "streamlit>=1.59.0",
    "uvicorn>=0.50.2",
    "langchain-groq>=1.1.3",
    "skills>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["." ]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
