

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rental_db
    environment:
      POSTGRES_DB: rental_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - rental_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property_api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/rental_ai
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:8b
      EMBEDDING_MODEL: nomic-embed-text
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: python main.py

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property_ui
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    command: streamlit run src/ui/app.py --server.address=0.0.0.0 --server.port=8501

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  rental_db_data:
  n8n_data:
